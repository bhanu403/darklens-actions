name: 'DarkLens Compliance Scan'
description: 'Scan pull requests and deployments for Dark Patterns and compliance violations (GDPR, FTC, CCPA).'
author: 'DarkLens'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  url:
    description: 'The URL of the deployment or staging server to audit (e.g., https://staging.myapp.com)'
    required: true
  api-key:
    description: 'DarkLens API Key (create at https://darklens.dev/dashboard)'
    required: true
  threshold:
    description: 'Minimum passing compliance score (0-100). Fails the workflow if score drops below threshold.'
    required: false
    default: '70'
  fail-on:
    description: 'Failure criterion: score, critical, or any'
    required: false
    default: 'score'
  comment-pr:
    description: 'Post or update a sticky DarkLens compliance report comment on pull requests (true/false)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token (e.g. secrets.GITHUB_TOKEN) used when comment-pr is true'
    required: false
    default: ''
  api-url:
    description: 'Optional custom DarkLens API endpoint override (defaults to https://darklens.dev/api/ci/scan)'
    required: false
    default: 'https://darklens.dev/api/ci/scan'
outputs:
  score:
    description: 'Compliance score returned by DarkLens (0-100)'
  issues-count:
    description: 'Number of detected dark pattern findings'
  critical-count:
    description: 'Number of critical dark pattern findings'
  pass:
    description: 'Whether the scan satisfied threshold and fail-on criteria (true/false)'
  summary:
    description: 'Concise compliance summary returned by DarkLens'
runs:
  using: 'node24'
  main: 'index.js'
